  - main [ref=f68e38]:
    - generic [ref=f68e39]:
      - generic [ref=f68e40]:
        - generic [ref=f68e41]: Uses
        - heading [level=1] [ref=f68e42]:
          - text: The tools I
          - generic [ref=f68e43]: actually reach for
          - text: .
        - paragraph [ref=f68e46]: The tools I actually reach for, not the ones I mean to learn.
        - paragraph [ref=f68e47]: updated September 2026
      - article [ref=f68e48]:
        - generic [ref=f68e49]:
          - heading [level=2] [ref=f68e50]:
            - link "Editors" [ref=f68e51] [cursor=pointer]:
              - /url: "#editors"
          - paragraph [ref=f68e52]:
            - strong [ref=f68e53]: Xcode
            - text: for anything Swift. It is the only real option for shipping to the App Store, and after a year of it I have stopped resenting that.
          - paragraph [ref=f68e54]:
            - strong [ref=f68e55]: JetBrains IDEs
            - text: for everything else. Kotlin Multiplatform work in particular is much less painful with a toolchain that understands Gradle properly.
          - paragraph [ref=f68e56]:
            - strong [ref=f68e57]: Claude Code
            - text: in the terminal alongside both. Every repo I work in has a
            - code [ref=f68e58]: CLAUDE.md
            - text: at the root, which is usually the fastest way to get a new machine, or a new collaborator, up to speed on how a project is put together.
          - heading [level=2] [ref=f68e59]:
            - link "Languages I reach for" [ref=f68e60] [cursor=pointer]:
              - /url: "#languages-i-reach-for"
          - paragraph [ref=f68e61]: Swift and SwiftUI for anything Apple. Kotlin Multiplatform with Compose when something needs to land on both phones from one codebase. TypeScript for the web. Python when the job is a script, a scraper, or anything with a data shape to wrangle.
          - heading [level=2] [ref=f68e62]:
            - link "Web" [ref=f68e63] [cursor=pointer]:
              - /url: "#web"
          - paragraph [ref=f68e64]:
            - strong [ref=f68e65]: Nuxt
            - text: for sites and apps, including this one. File-based routing and server routes in the same project means there is rarely a reason to stand up a separate backend.
          - paragraph [ref=f68e66]:
            - strong [ref=f68e67]: Nuxt Content
            - text: for anything writing-shaped. Markdown in git beats a CMS for a site only one person edits.
          - heading [level=2] [ref=f68e68]:
            - link "Infrastructure" [ref=f68e69] [cursor=pointer]:
              - /url: "#infrastructure"
          - paragraph [ref=f68e70]:
            - strong [ref=f68e71]: Cloudflare Workers
            - text: hosts this site, with KV for cached stats and R2 for build artifacts. The free tier is genuinely generous and deploys take seconds.
          - paragraph [ref=f68e72]:
            - strong [ref=f68e73]: AWS
            - text: "for work that needs it: ECS, RDS, SageMaker. Most of my professional infrastructure experience lives here rather than on Cloudflare."
          - paragraph [ref=f68e74]:
            - strong [ref=f68e75]: GitHub Actions
            - text: for CI. Tests on every push, builds on every tag.
          - heading [level=2] [ref=f68e76]:
            - link "Small things that earn their keep" [ref=f68e77] [cursor=pointer]:
              - /url: "#small-things-that-earn-their-keep"
          - list [ref=f68e78]:
            - listitem [ref=f68e79]:
              - strong [ref=f68e80]: uv
              - text: for Python. It made virtualenv management a non-problem.
            - listitem [ref=f68e81]:
              - strong [ref=f68e82]: XcodeGen
              - text: ", so an Xcode project file is generated from a YAML file instead of being a merge conflict waiting to happen."
            - listitem [ref=f68e83]:
              - strong [ref=f68e84]: Sparkle
              - text: for shipping updates to Mac apps distributed outside the store.
            - listitem [ref=f68e85]:
              - strong [ref=f68e86]: Resend
              - text: for transactional email, including the form on the contact page.
            - listitem [ref=f68e87]:
              - strong [ref=f68e88]: Turnstile
              - text: in front of that form, because the alternative is spam.
