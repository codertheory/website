                - generic [ref=f67e62]: Full-stack at TripNinja
                - generic [ref=f67e63]: Built an auth microservice, then scaffolded and spun up the API Gateway our API sits behind, routing 10k+ daily requests to the Django core. Also untangled Celery and ECS auto-scaling under peak load.
              - listitem [ref=f67e64]:
                - generic [ref=f67e65]: 2023-2025
                - generic [ref=f67e66]: Full-stack at ChartD
                - generic [ref=f67e67]: Founding engineer. Built an AI chat app that plugged into companies' own data, learned to train/deploy models on SageMaker, then we pivoted into an SDLC product. Owned all the AWS as one of two engineers.
              - listitem [ref=f67e68]:
                - generic [ref=f67e69]: 2021-2023
                - generic [ref=f67e70]: Full-stack at FarmLink
                - generic [ref=f67e71]: Vue + Django Price Map for North American grain farmers to find/locate bins and see prices, with filters that email you when a price goes below/above what you set. Also mentored co-ops on TDD.
