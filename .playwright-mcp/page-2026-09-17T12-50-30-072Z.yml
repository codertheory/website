              - paragraph [ref=f67e55]: Over 7 years building web applications, mostly Python (Django, FastAPI) on the back and Vue/Nuxt or React on the front, with the AWS underneath it. Lately I have been deep in Kotlin Multiplatform and Swift, shipping a manga reader to iOS and Android.
              - paragraph [ref=f67e56]: Codertheory is where I keep the things I make and the things I think out loud about. Take whatever is useful.
